# Build/runtime tuning
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true

# The IntelliJ Platform already ships the Kotlin standard library, so don't
# bundle a second copy into the plugin.
kotlin.stdlib.default.dependency=false

# Opt out of IntelliJ Platform Gradle Plugin usage statistics
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck=false
