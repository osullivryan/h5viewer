name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5viewer-plugin
          path: build/distributions/*.zip

      - name: Build HDF5 JDBC driver
        run: ./gradlew :jdbc:shadowJar

      - name: Upload JDBC driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-jdbc-driver
          path: jdbc/build/libs/*-all.jar
