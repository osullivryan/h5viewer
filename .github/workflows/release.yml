name: Release

# Publishes to the JetBrains Marketplace when a version tag is pushed (e.g. v0.1.0).
# Required repository secret:
#   PUBLISH_TOKEN - Marketplace permanent token (https://plugins.jetbrains.com/author/me/tokens)
# The plugin is published unsigned. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Verify & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the built zip to the GitHub Release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Build HDF5 JDBC driver
        run: ./gradlew :jdbc:shadowJar

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Attach plugin zip and JDBC driver to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/*.zip
            jdbc/build/libs/*-all.jar
          generate_release_notes: true
