name: Release

# Publishes to the JetBrains Marketplace when a version tag is pushed (e.g. v0.1.0).
# Required repository secrets:
#   PUBLISH_TOKEN         - Marketplace permanent token (https://plugins.jetbrains.com/author/me/tokens)
#   CERTIFICATE_CHAIN     - plugin signing certificate chain (PEM)
#   PRIVATE_KEY           - plugin signing private key (PEM)
#   PRIVATE_KEY_PASSWORD  - password for the private key
# See the "Publishing" section of the README for how to generate the signing material.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Verify & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the built zip to the GitHub Release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Sign and publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Attach plugin zip to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
